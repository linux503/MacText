<body class="changelog-page">
  <div class="atmosphere" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
  </div>
  <div class="noise" aria-hidden="true"></div>
  <div class="page">
    <nav class="nav">
      <a class="brand" href="./">
        <img src="../assets/icon-256.png" width="30" height="30" alt="" />
        MacText
      </a>
      <div class="nav-end">
        <div class="nav-links">
          <a href="./#showcase">界面</a>
          <a href="./#features">功能</a>
          <a href="./changelog.html" aria-current="page">更新记录</a>
          <a href="https://github.com/linux503/MacText">GitHub</a>
        </div>
        <div class="lang" role="group" aria-label="语言">
          <a class="lang-link" href="../changelog.html" data-lang="en">EN</a>
          <a class="lang-link is-active" href="./changelog.html" data-lang="zh">中文</a>
        </div>
        <a class="btn btn-solid btn-sm" href="./#download">下载</a>
      </div>

      <span>© 2026 MacText · 原生 AppKit</span>

    </footer>

  <script>
    (function () {
      var q = new URLSearchParams(location.search).get("lang");
      if (q === "en") {
        localStorage.setItem("mactext-lang", "en");
        location.replace("../changelog.html");
        return;
      }
      localStorage.setItem("mactext-lang", "zh");
      document.querySelectorAll("[data-lang]").forEach(function (a) {
        a.addEventListener("click", function () {
          localStorage.setItem("mactext-lang", a.getAttribute("data-lang"));
        });
      });
    })();
  </script>
  <script src="../assets/site.js?v=6"></script>
