[package]
name = "MacText"
version = "1.1.7"
edition = "2021"
description = "MacText for Windows — same Ink design as the macOS editor"

[[bin]]
name = "MacText"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
